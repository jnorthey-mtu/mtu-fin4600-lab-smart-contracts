[project]
name = "mtu-fin4600-lab-smart-contracts"
version = "1.0.0"
description = "FIN 4600 lab: compile, deploy, attack and fix Solidity smart contracts on an in-memory Ethereum test chain"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "web3[tester]>=7.0",
    "py-solc-x>=2.0",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "jupyterlab>=4.0",
]

[tool.uv]
package = false
# safe-pysha3 (pulled in by eth-tester[py-evm] -> eth-hash[pysha3]) ships no
# Windows wheels and needs MSVC to build. eth-hash falls back to the
# pycryptodome backend (already required by web3), so never install it.
override-dependencies = ["safe-pysha3; sys_platform == 'never'"]
